<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <title>Infoskærm - Live</title>

    <link rel="icon" href="data:,">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<!-- ============================================================
     MEDIEOMRÅDE
     ============================================================ -->

<div class="media-container">

    {% if medier %}

        {% for medie in medier %}

            {% if medie["filnavn"].lower().endswith(('.mp4', '.webm', '.mov')) %}

                <video
                    src="{{ url_for('admin.uploaded_file', filename=medie['filnavn']) }}"
                    class="slide {% if loop.first %}active{% endif %}"
                    muted
                    playsinline
                    preload="auto"
                ></video>

            {% else %}

                <img
                    src="{{ url_for('admin.uploaded_file', filename=medie['filnavn']) }}"
                    class="slide {% if loop.first %}active{% endif %}"
                    alt="Medie"
                >

            {% endif %}

        {% endfor %}

    {% else %}

        <div class="no-media">
            Ingen aktive medier.
        </div>

    {% endif %}

</div>



<!-- ============================================================
     SIDEPANEL
     ============================================================ -->

<div class="sidebar">

    <div class="clock-section">

        <div id="date"></div>

        <div id="time"></div>

    </div>


    <div class="weather">

        <i
            id="weather-icon"
            class="bi bi-cloud-sun"
        ></i>

        <div class="weather-info">

            <div id="weather-city">
                {{ by }}
            </div>

            <div id="weather-temp">
                {{ temp }}
            </div>

            <div id="weather-description">
                {{ beskrivelse }}
            </div>

        </div>

    </div>

</div>



<!-- ============================================================
     NYHEDSBJÆLKE
     ============================================================ -->

<div class="ticker-wrap">

    <div class="ticker-label">
        Seneste nyt
    </div>


    <div class="ticker-window">

        <div
            class="ticker"
            id="news-ticker"
        >

            <div
                class="ticker-content"
                id="ticker-content-1"
            ></div>

            <div
                class="ticker-content"
                id="ticker-content-2"
            ></div>

        </div>

    </div>

</div>



<script>


/* ============================================================
   KONFIGURATION
   ============================================================ */

const MEDIE_TJEK_INTERVAL =
    5000;

const VEJR_INTERVAL =
    300000;

const BURNIN_INTERVAL =
    120000;


/* ============================================================
   MEDIEAFSPILLER
   ============================================================ */

let slides =
    document.querySelectorAll(".slide");

let current =
    0;

let slideshowTimeout =
    null;

let nuvaerendeMedier =
    Array.from(slides).map(
        slide => {

            const src =
                slide.getAttribute("src");

            if (!src) {
                return null;
            }

            try {

                return decodeURIComponent(
                    src.split("/").pop()
                );

            } catch {

                return src.split("/").pop();

            }

        }
    ).filter(Boolean);


let billedMillisekunder =
    {{ sekunder }} * 1000;



/* ============================================================
   START SLIDESHOW
   ============================================================ */

function koerSlideshow() {

    clearTimeout(
        slideshowTimeout
    );

    slides =
        document.querySelectorAll(
            ".slide"
        );


    if (slides.length === 0) {
        return;
    }


    if (current >= slides.length) {
        current = 0;
    }


    const aktivtMedie =
        slides[current];


    if (!aktivtMedie) {

        current = 0;

        return koerSlideshow();

    }


    aktivtMedie.classList.add(
        "active"
    );


    /* --------------------------------------------------------
       VIDEO
       -------------------------------------------------------- */

    if (
        aktivtMedie.tagName === "VIDEO"
    ) {

        aktivtMedie.currentTime = 0;


        aktivtMedie.onended =
            () => {

                skiftMedie();

            };


        aktivtMedie.play().catch(
            () => {}
        );


        return;
    }


    /* --------------------------------------------------------
       BILLEDE
       -------------------------------------------------------- */

    slideshowTimeout =
        setTimeout(
            skiftMedie,
            billedMillisekunder
        );

}



/* ============================================================
   SKIFT MEDIE
   ============================================================ */

function skiftMedie() {

    clearTimeout(
        slideshowTimeout
    );


    slides =
        document.querySelectorAll(
            ".slide"
        );


    if (slides.length === 0) {
        return;
    }


    const gammeltMedie =
        slides[current];


    if (gammeltMedie) {

        if (
            gammeltMedie.tagName === "VIDEO"
        ) {

            gammeltMedie.pause();

            gammeltMedie.currentTime = 0;

            gammeltMedie.onended = null;

        }


        gammeltMedie.classList.remove(
            "active"
        );

    }


    current =
        (current + 1) % slides.length;


    const nytMedie =
        slides[current];


    if (!nytMedie) {

        current = 0;

        return koerSlideshow();

    }


    nytMedie.classList.add(
        "active"
    );


    koerSlideshow();

}



/* ============================================================
   OPDATER MEDIER
   ============================================================ */

async function tjekEfterNyeMedier() {

    try {

        const response =
            await fetch(
                "/hent-aktive-medier",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        if (
            data.sekunder &&
            data.sekunder > 0
        ) {

            billedMillisekunder =
                data.sekunder * 1000;

        }


        const nyMedieListe =
            data.medier || [];


        const nyListeJSON =
            JSON.stringify(
                nyMedieListe
            );


        const gammelListeJSON =
            JSON.stringify(
                nuvaerendeMedier
            );


        if (
            nyListeJSON ===
            gammelListeJSON
        ) {

            return;

        }


        nuvaerendeMedier =
            [...nyMedieListe];


        const container =
            document.querySelector(
                ".media-container"
            );


        if (!container) {
            return;
        }


        clearTimeout(
            slideshowTimeout
        );


        document
            .querySelectorAll("video")
            .forEach(video => {

                video.pause();

                video.onended = null;

            });


        current = 0;


        container.innerHTML = "";


        /* ----------------------------------------------------
           INGEN MEDIER
           ---------------------------------------------------- */

        if (
            nyMedieListe.length === 0
        ) {

            container.innerHTML = `
                <div class="no-media">
                    Ingen aktive medier.
                </div>
            `;


            slides =
                document.querySelectorAll(
                    ".slide"
                );


            return;
        }


        /* ----------------------------------------------------
           OPBYG NY MEDIELISTE
           ---------------------------------------------------- */

        nyMedieListe.forEach(
            (filnavn, index) => {

                const fil =
                    filnavn.toLowerCase();


                const erVideo =
                    fil.endsWith(".mp4") ||
                    fil.endsWith(".webm") ||
                    fil.endsWith(".mov");


                let element;


                if (erVideo) {

                    element =
                        document.createElement(
                            "video"
                        );

                    element.muted = true;

                    element.playsInline = true;

                    element.preload = "auto";

                } else {

                    element =
                        document.createElement(
                            "img"
                        );

                }


                element.src =
                    `/uploads/${encodeURIComponent(
                        filnavn
                    )}`;


                element.className =
                    "slide";


                if (index === 0) {

                    element.classList.add(
                        "active"
                    );

                }


                container.appendChild(
                    element
                );

            }
        );


        slides =
            document.querySelectorAll(
                ".slide"
            );


        koerSlideshow();


    } catch (error) {

        console.error(
            "Mediefejl:",
            error
        );

    }

}



/* ============================================================
   NYHEDER
   ============================================================ */

let tickerMillisekunder =
    {{ ticker_sekunder }} * 1000;


let drIntervalMillisekunder =
    {{ dr_interval_sekunder }} * 1000;


let tickerUpdateTimer =
    null;


let sidsteNyhedsTekst =
    "";



/* ============================================================
   OPDATER TICKER-HASTIGHED
   ============================================================ */

function opdaterTickerHastighed(
    sekunder
) {

    if (
        !sekunder ||
        sekunder < 1
    ) {

        return;

    }


    tickerMillisekunder =
        sekunder * 1000;


    const ticker =
        document.querySelector(
            "#news-ticker"
        );


    if (ticker) {

        ticker.style.setProperty(
            "--ticker-duration",
            sekunder + "s"
        );

    }

}



/* ============================================================
   OPBYG TICKER
   ============================================================ */

function bygTickerIndhold(
    container,
    nyheder
) {

    if (!container) {
        return;
    }


    container.innerHTML =
        "";


    if (
        !nyheder ||
        nyheder.length === 0
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "ticker-item";


        div.textContent =
            "Ingen nye opdateringer...";


        container.appendChild(
            div
        );


        return;
    }


    nyheder.forEach(
        tekst => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ticker-item";


            div.textContent =
                tekst;


            container.appendChild(
                div
            );

        }
    );

}



/* ============================================================
   HENT NYHEDER
   ============================================================ */

async function reloadTickerNews() {

    try {

        const response =
            await fetch(
                "/hent-nyheder",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        /* ----------------------------------------------------
           TICKER HASTIGHED
           ---------------------------------------------------- */

        if (
            data.ticker_sekunder &&
            data.ticker_sekunder > 0
        ) {

            opdaterTickerHastighed(
                data.ticker_sekunder
            );

        }


        /* ----------------------------------------------------
           DR OPDATERINGSINTERVAL
           ---------------------------------------------------- */

        if (
            data.dr_interval_sekunder &&
            data.dr_interval_sekunder > 0
        ) {

            const nytInterval =
                data.dr_interval_sekunder *
                1000;


            if (
                nytInterval !==
                drIntervalMillisekunder
            ) {

                drIntervalMillisekunder =
                    nytInterval;


                startNyhedsTimer();

            }

        }


        /* ----------------------------------------------------
           NYHEDER
           ---------------------------------------------------- */

        const alleNyheder =
            data.nyheder || [];


        const nyhedsTekst =
            alleNyheder.join("|||");


        /*
         * Hvis nyhederne er identiske,
         * skal vi ikke ændre DOM'en.
         */

        if (
            nyhedsTekst ===
            sidsteNyhedsTekst
        ) {

            return;

        }


        sidsteNyhedsTekst =
            nyhedsTekst;


        const ticker1 =
            document.querySelector(
                "#ticker-content-1"
            );


        const ticker2 =
            document.querySelector(
                "#ticker-content-2"
            );


        if (
            !ticker1 ||
            !ticker2
        ) {

            return;

        }


        /*
         * Opdater begge spor.
         */

        bygTickerIndhold(
            ticker1,
            alleNyheder
        );


        bygTickerIndhold(
            ticker2,
            alleNyheder
        );


    } catch (error) {

        console.error(
            "Nyhedsfejl:",
            error
        );

    }

}



/* ============================================================
   START NYHEDSTIMER
   ============================================================ */

function startNyhedsTimer() {

    if (tickerUpdateTimer) {

        clearInterval(
            tickerUpdateTimer
        );

    }


    tickerUpdateTimer =
        setInterval(
            reloadTickerNews,
            drIntervalMillisekunder
        );

}



/* ============================================================
   VEJR
   ============================================================ */

async function hentVejr() {

    try {

        const response =
            await fetch(
                "/hent-vejr",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const temp =
            document.getElementById(
                "weather-temp"
            );


        const description =
            document.getElementById(
                "weather-description"
            );


        const city =
            document.getElementById(
                "weather-city"
            );


        const icon =
            document.getElementById(
                "weather-icon"
            );


        if (temp) {

            temp.textContent =
                data.temp;

        }


        if (description) {

            description.textContent =
                data.beskrivelse;

        }


        if (
            city &&
            data.by
        ) {

            city.textContent =
                data.by;

        }


        if (
            icon &&
            data.ikon
        ) {

            icon.className =
                "bi bi-" + data.ikon;

        }


    } catch (error) {

        console.error(
            "Vejrfejl:",
            error
        );

    }

}



/* ============================================================
   UR OG DATO
   ============================================================ */

function updateClock() {

    const now =
        new Date();


    const time =
        document.getElementById(
            "time"
        );


    const date =
        document.getElementById(
            "date"
        );


    if (time) {

        time.innerText =
            now.toLocaleTimeString(
                "da-DK",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    if (date) {

        const dateStr =
            now.toLocaleDateString(
                "da-DK",
                {
                    weekday: "short",
                    day: "numeric",
                    month: "short"
                }
            );


        date.innerText =
            dateStr
                .toUpperCase()
                .replace(
                    /,/g,
                    ""
                );

    }

}



/* ============================================================
   BURN-IN BESKYTTELSE
   ============================================================ */

let burnInPosition =
    0;


function skiftBurnIn() {

    const clock =
        document.querySelector(
            ".clock-section"
        );


    if (!clock) {
        return;
    }


    clock.classList.remove(
        "burnin-0",
        "burnin-1",
        "burnin-2",
        "burnin-3",
        "burnin-4"
    );


    burnInPosition =
        (burnInPosition + 1) % 5;


    clock.classList.add(
        "burnin-" + burnInPosition
    );

}



/* ============================================================
   START
   ============================================================ */


/*
 * Ur
 */

updateClock();


setInterval(
    updateClock,
    1000
);


/*
 * Medier
 */

koerSlideshow();


tjekEfterNyeMedier();


setInterval(
    tjekEfterNyeMedier,
    MEDIE_TJEK_INTERVAL
);


/*
 * Vejr
 */

hentVejr();


setInterval(
    hentVejr,
    VEJR_INTERVAL
);


/*
 * Nyheder
 */

opdaterTickerHastighed(
    {{ ticker_sekunder }}
);


reloadTickerNews()
    .then(() => {

        startNyhedsTimer();

    });


/*
 * Burn-in beskyttelse
 */

setInterval(
    skiftBurnIn,
    BURNIN_INTERVAL
);


</script>


</body>

</html>
