<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Infoskærm</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f9;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 320px;
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 24px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: 0;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Infoskærm</h1>

    {% if fejl %}
        <div class="error">{{ fejl }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">

        <label for="brugernavn">
            Brugernavn
        </label>

        <input
            id="brugernavn"
            type="text"
            name="brugernavn"
            value="admin"
            required
            autofocus
        >

        <label for="kode">
            Kode
        </label>

        <input
            id="kode"
            type="password"
            name="kode"
            required
        >

        <button type="submit">
            Log ind
        </button>

    </form>

</div>

</body>
</html>
