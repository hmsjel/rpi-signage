<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Infoskærm - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;

            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;

            background: #fff;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .fejl {
            background: #f8d7da;

            color: #721c24;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>Infoskærm</h1>


    {% if fejl %}

        <div class="fejl">
            {{ fejl }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <label for="brugernavn">
            Brugernavn
        </label>

        <input
            type="text"
            id="brugernavn"
            name="brugernavn"
            required
            autofocus
        >


        <label for="kode">
            Adgangskode
        </label>

        <input
            type="password"
            id="kode"
            name="kode"
            required
        >


        <button type="submit">
            Log ind
        </button>

    </form>

</div>


</body>

</html>
